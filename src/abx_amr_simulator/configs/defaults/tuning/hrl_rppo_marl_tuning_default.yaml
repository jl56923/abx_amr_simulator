# Default HRL-RecurrentPPO hyperparameter tuning configuration for MARL experiments.
#
# Used by `tune_marl_agent.py` to tune one agent at a time extracted from a
# MARL config where that agent's `algorithm` field is `HRL_RPPO`.  Each agent
# is tuned in isolation using a single-agent ABXAMREnv + OptionsWrapper
# (not MARLOptionsWrapper).  Structurally parallel to the single-agent
# `hrl_rppo_tuning.yaml`, with three MARL-specific differences:
#
#   1. `truncated_primitive_steps` is used instead of `truncated_episodes`,
#      because the MARL tuning loop works in primitive env-step units.
#      The budget matches the HRL-PPO MARL default (250k primitive steps)
#      for comparability; this is ~500 episodes of a 500-step env.
#
#   2. `option_gamma` is intentionally excluded from the search space.
#      During MARL training, `option_gamma` is a shared property of
#      `MARLOptionsWrapper` and is set in the MARL config YAML, not
#      per-agent.
#
#   3. `batch_size` is intentionally excluded.  It is read from the
#      `training` section of the MARL config uniformly across agents and
#      is not overlaid from per-agent tuning results.
#
# Key differences from HRL-PPO MARL tuning:
#   - LSTM-based manager policy requires more conservative learning rates
#     (range kept consistent with `hrl_ppo_marl_tuning_default.yaml`).
#   - Shorter rollout lengths in option-steps (n_steps: 8-64, matching the
#     4:1 feedforward:recurrent ratio used in the single-agent config).
#   - n_seeds_per_trial and n_trials are bumped slightly to account for
#     the dual-complexity (temporal abstraction + LSTM memory) of HRL_RPPO.
#
# LSTM hyperparameters (`lstm_hidden_size`, `n_lstm_layers`,
# `enable_critic_lstm`) and the MLP `policy_kwargs.net_arch` are NOT part
# of the tuning search space; they are declared per-agent in the MARL
# config YAML (`lstm_kwargs:` and `policy_kwargs:` sub-blocks on the agent
# entry) and are fixed across trials for a given experiment.

optimization:
  n_trials: 48
  n_seeds_per_trial: 5
  truncated_primitive_steps: 250000
  direction: maximize
  sampler: TPE
  stability_penalty_weight: 0.3

  early_stopping:
    enabled: true
    warmup_trials: 8
    patience: 8
    min_delta: 2.0

  tpe_config:
    n_startup_trials: null
    constant_liar: auto

search_space:
  learning_rate:
    type: float
    low: 5.0e-6
    high: 5.0e-4
    log: true

  # n_steps is in OPTION-STEPS, not environment steps.
  # Range [8, 64] × avg_option_duration (~20 env-steps) ≈ 160–1280 env-steps
  # per rollout, maintaining the 4:1 feedforward:recurrent ratio used in
  # the single-agent `hrl_rppo_tuning.yaml` config.
  n_steps:
    type: int
    low: 8
    high: 64
    step: 8

  gamma:
    type: float
    low: 0.95
    high: 0.999

  gae_lambda:
    type: float
    low: 0.9
    high: 0.99

  ent_coef:
    type: categorical
    choices: [0.01, 0.05, 0.1, 0.2, 0.3]

  clip_range:
    type: float
    low: 0.1
    high: 0.3

  n_epochs:
    type: int
    low: 5
    high: 15
    step: 1
